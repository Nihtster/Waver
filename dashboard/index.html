<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAVER Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1>〰 WAVER</h1>
            <p>Enter your password to continue</p>
            <input type="password" id="password" placeholder="Password" autofocus>
            <button onclick="login()">Login</button>
            <p id="login-error" class="error hidden">Invalid password</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="screen hidden">
        <header>
            <h1>〰 WAVER</h1>
            <div id="system-info">
                <span id="uptime">--</span>
                <span id="temp">--</span>
                <span id="ip">--</span>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </header>

        <main>
            <!-- Services -->
            <section class="card">
                <h2>Services</h2>
                <div class="service-grid">
                    <div class="service" id="svc-pihole">
                        <div class="service-info">
                            <span class="service-name">Pi-hole</span>
                            <span class="service-status">--</span>
                        </div>
                        <button class="toggle-btn" onclick="toggleService('pihole')">Toggle</button>
                    </div>
                    <div class="service" id="svc-wireguard">
                        <div class="service-info">
                            <span class="service-name">WireGuard</span>
                            <span class="service-status">--</span>
                        </div>
                        <button class="toggle-btn" onclick="toggleService('wireguard')">Toggle</button>
                    </div>
                    <div class="service" id="svc-ssh">
                        <div class="service-info">
                            <span class="service-name">SSH</span>
                            <span class="service-status">--</span>
                        </div>
                    </div>
                    <div class="service" id="svc-nginx">
                        <div class="service-info">
                            <span class="service-name">Nginx</span>
                            <span class="service-status">--</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Pi-hole Stats -->
            <section class="card">
                <h2>Pi-hole Stats</h2>
                <div class="stats-grid">
                    <div class="stat">
                        <span class="stat-value" id="pihole-queries">--</span>
                        <span class="stat-label">Queries Today</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="pihole-blocked">--</span>
                        <span class="stat-label">Blocked</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="pihole-percent">--%</span>
                        <span class="stat-label">Block Rate</span>
                    </div>
                </div>
                <a href="/pihole/admin" target="_blank" class="link-btn">
                    Open Pi-hole Admin →
                </a>
            </section>

            <!-- Network -->
            <section class="card">
                <h2>Network</h2>
                <div class="stats-grid">
                    <div class="stat">
                        <span class="stat-value" id="net-ip">--</span>
                        <span class="stat-label">IP Address</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="net-signal">--</span>
                        <span class="stat-label">WiFi Signal</span>
                    </div>
                </div>
            </section>

            <!-- WiFi Manager -->
            <section class="card">
                <h2>WiFi Manager</h2>
                <button class="scan-btn" onclick="scanWifi()">Scan Networks</button>
                <div id="wifi-networks"></div>
                <div id="wifi-connect-form" class="hidden">
                    <p id="connecting-ssid"></p>
                    <input type="password" id="wifi-password" placeholder="WiFi Password">
                    <button onclick="connectWifi()">Connect</button>
                    <button class="cancel-btn" onclick="cancelConnect()">Cancel</button>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>

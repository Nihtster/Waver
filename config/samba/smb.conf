[global]
   workgroup = WORKGROUP
   server string = Waver
   server role = standalone server
   log file = /var/log/samba/log.%m
   max log size = 500
   dns proxy = no
   # Open LAN share — no password required
   map to guest = bad user
   usershare allow guests = yes

[rsvp-books]
   comment = Waver RSVP Book Library
   path = /home/cimi/waver/rsvp-books
   browseable = yes
   writable = yes
   guest ok = yes
   guest only = yes
   create mask = 0644
   directory mask = 0755
   force user = cimi

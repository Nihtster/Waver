# Redirect plain HTTP to HTTPS
server {
    listen 80;
    server_name waver.local 192.168.0.191 _;
    return 301 https://$host$request_uri;
}

# Waver dashboard + API over HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name waver.local 192.168.0.191 _;

    ssl_certificate     /etc/ssl/waver/waver.crt;
    ssl_certificate_key /etc/ssl/waver/waver.key;

    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:1m;
    ssl_session_timeout        10m;

    # Flask API + Dashboard
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout    60;
        proxy_connect_timeout 60;
    }
}

# Note: Pi-hole admin is reached directly at port 8080, not proxied here.
# Reverse-proxying Pi-hole at a sub-path requires Pi-hole-side webhome
# config and the maintenance burden isn't worth the marginal UX win.
# The dashboard's "Open Pi-hole Admin" link points at :8080 directly.
